
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PG_USERNAME:?defina no .env da raiz}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?defina no .env da raiz}
      POSTGRES_DB: condominio
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d condominio"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file: ./.env
    environment:
      PG_HOST: db
      PG_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
