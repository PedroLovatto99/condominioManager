
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PG_USERNAME:?defina no .env da raiz}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?defina no .env da raiz}
      POSTGRES_DB: condominio
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d condominio"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file: ./.env
    environment:
      PG_HOST: db
      PG_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      API_URL: http://api:8000
      USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/condominio-frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  frontend_node_modules:
